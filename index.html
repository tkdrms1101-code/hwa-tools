<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7f1925">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>화려한우 생산관리</title>
<style>
/* VOICE: 현장용 업무 도구 — 간결체, 숫자 먼저
   IDEA: 2차작업장 사무실 화이트보드를 온라인 공유 장부로
   PICTURE: 첫 화면 KPI 줄과 오늘 입력 칸이 곧 그림
   COLOUR and TYPE: 화려한우 디자인 시스템 — 크림슨 머리 띠, 금박 선, 미색 바탕, Pretendard
   LAYOUT: 머리 띠 + 메뉴 탭, 본문 최대 1100px, 600px 이하 한 줄 쌓기 */
:root{color-scheme:light dark;
--bg:light-dark(#f7f4ee,#1a1816);--card:light-dark(#ffffff,#24211e);--chip:light-dark(#efe7d8,#2e2a25);--line:light-dark(#e3ddd2,#3a3530);
--ink:light-dark(#1c1a17,#f2ede4);--mut:light-dark(#6b645a,#a59d91);--hw:light-dark(#7f1925,#ee8f97);--hws:light-dark(#f8e4e6,#3e1e22);
--good:light-dark(#2f6b4f,#7cc79f);--goods:light-dark(#e2efe7,#1f3328);--warn:light-dark(#8a5d0e,#e3b55a);--warns:light-dark(#f6ecd6,#3a2f18);
--alert:light-dark(#a33a17,#ff9e72);--alerts:light-dark(#fbe6dc,#3d2418);--gilt:#e8ceb7;--deep:light-dark(#600912,#4a0a12);--bright:#9a2635}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;overflow-x:clip}
.top{background:linear-gradient(135deg,var(--bright),var(--deep));color:#fff;border-bottom:3px solid var(--gilt)}
.topin{max-width:1100px;margin:auto;padding:18px max(4vw,16px) 0}
.brand{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand img{height:30px;width:auto}
.brand h1{font-size:18px;font-weight:800;margin:0;color:#fff}
.sync{margin-inline-start:auto;font-size:13px;color:var(--gilt);white-space:nowrap}
.nav{display:flex;gap:4px;overflow-x:auto;margin-top:14px;scrollbar-width:none}
.nav a{flex:none;color:#f3dfe1;text-decoration:none;font-weight:600;padding:10px 14px;border-radius:10px 10px 0 0;min-height:44px}
.nav a.on{background:var(--bg);color:var(--hw)}
main{max-width:1100px;margin:auto;padding:24px max(4vw,16px) 64px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--hw)}
h2{font-size:26px;line-height:1.25;margin:2px 0 4px;font-weight:800}
.sub{color:var(--mut);margin:0 0 20px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px;margin-bottom:24px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.kpi small{display:block;color:var(--mut);font-size:12px;font-weight:600}
.kpi b{display:block;font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2;margin-top:4px}
.kpi b i{font-style:normal;font-size:14px;font-weight:600;color:var(--mut);margin-inline-start:3px}
.kpi span{font-size:12px;color:var(--mut)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:20px;align-items:start}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:20px}
.ph{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line)}
.ph h3{font-size:14px;font-weight:800;margin:0}
.ph .hint{margin-inline-start:auto}
.pb{padding:16px}
.hint{font-size:12px;color:var(--mut)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:12px}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--mut)}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px 10px;min-height:44px;width:100%}
textarea{min-height:120px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--hw);outline-offset:1px}
.wide{grid-column:1/-1}
.btn{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 16px;min-height:44px;cursor:pointer;white-space:nowrap}
.btn.pri{background:var(--hw);color:light-dark(#fff,#1a1816);border-color:transparent}
.btn.sm{min-height:34px;padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:7px 13px;min-height:38px;cursor:pointer}
.chip.on{background:var(--hw);color:light-dark(#fff,#1a1816);border-color:transparent}
table{width:100%;border-collapse:collapse;font-size:14px}
th{background:var(--chip);font-size:12px;text-align:start;font-weight:700;padding:8px 10px;white-space:nowrap}
td{border-top:1px solid var(--line);padding:8px 10px;vertical-align:top}
.n{text-align:end;font-variant-numeric:tabular-nums;white-space:nowrap}
.scroll{overflow-x:auto}
.badge{display:inline-block;font-size:12px;font-weight:700;border-radius:6px;padding:2px 7px;white-space:nowrap}
.b-good{background:var(--goods);color:var(--good)}.b-warn{background:var(--warns);color:var(--warn)}.b-alert{background:var(--alerts);color:var(--alert)}.b-hw{background:var(--hws);color:var(--hw)}
.empty{color:var(--mut);padding:20px 4px;text-align:center}
.bars .br{display:grid;grid-template-columns:92px 1fr 64px;gap:8px;align-items:center;margin:6px 0;font-size:13px}
.bars .tr{background:var(--chip);border-radius:6px;height:18px;overflow:hidden}
.bars .fl{background:var(--hw);height:100%}
.drop{border:1.5px dashed var(--line);border-radius:14px;padding:22px;text-align:center}
.drop:hover{border-color:var(--hw);background:var(--hws)}
.sec{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.note{background:var(--hws);border-radius:10px;padding:12px 14px;font-size:14px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9;max-width:90vw}
.toast.show{opacity:1}
.nb{display:inline-block;margin-inline-start:6px;background:var(--gilt);color:var(--deep);border-radius:999px;font-size:11px;font-weight:800;padding:1px 7px;vertical-align:1px}
.memo{display:grid;gap:6px;padding:12px 0;border-top:1px solid var(--line)}.memo:first-child{border-top:0}
.memo p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}.memo.done p{color:var(--mut);text-decoration:line-through}
.memo .mh{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--mut)}.memo .mh .row{margin-inline-start:auto}
main:has(.sgrid){max-width:1320px}
.sgrid .kpis{grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));margin-bottom:16px}
.b-chip{background:var(--chip);color:var(--ink)}
.sfl-t{display:none}
@media(max-width:760px){.sfl-t{display:block;width:100%;margin-top:8px}.sflt:not(.open) #sFl{display:none}.bxbar{bottom:6px;padding:10px}.bxbar textarea{display:none}.bxr{gap:6px 10px}}
.ibs input{min-height:36px;padding:5px 8px;font-size:14px}.ibs td{padding:4px}
.ltl{display:grid;gap:10px}.ltg{border:1px solid var(--line);border-radius:10px;overflow:hidden}.ltgh{background:var(--chip);padding:6px 12px;font-size:12px;font-weight:700;color:var(--mut)}.ltr{display:flex;gap:8px;align-items:center;padding:6px 12px;border-top:1px solid var(--line);font-size:15px}.ltr:first-of-type{border-top:0}.ltr.new{background:var(--warns)}
.bxret{flex:1 1 100%;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-top:8px;border-top:1px solid rgba(255,255,255,.2)}.bxret[hidden]{display:none}.bxret input{flex:1 1 220px;min-height:36px;padding:5px 8px}
.ibg{min-width:900px}.ibg th{position:sticky;top:0}.ibg td{padding:3px 4px;vertical-align:top}.ibg input{min-height:36px;padding:5px 8px;font-size:14px;min-width:100px;background:var(--card)}.ibg input:focus{background:var(--hws)}
.ibg tr[data-id] td:first-child input{font-weight:700}.ibg .ibw:empty{display:none}.ibg .ibw{margin-top:3px}
.trw{display:flex;align-items:stretch}.trw input{flex:1;font-size:20px;letter-spacing:.04em;font-variant-numeric:tabular-nums}
.trp{display:grid;place-items:center;padding:0 12px;background:var(--hw);color:light-dark(#fff,#1a1816);font-weight:800;font-size:18px;border-radius:6px 0 0 6px}
.trp:not([hidden])+input{border-radius:0 6px 6px 0}
.trp[hidden]{display:none}
.mono{font-family:ui-monospace,Consolas,"D2Coding",monospace;font-variant-numeric:tabular-nums}
.gr{display:inline-grid;place-items:center;min-width:28px;height:24px;padding:0 6px;border-radius:6px;background:var(--chip);font-weight:800;font-size:13px}
.sgrid{display:grid;grid-template-columns:220px 1fr;gap:16px;align-items:start}
@media(max-width:760px){.sgrid{grid-template-columns:1fr}.sflt{position:static;max-height:none}}
.sflt{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;margin:0}
.fg{border-top:1px solid var(--line);padding:10px 12px}.fg:first-child{border-top:0}
.fgh{display:flex;align-items:center;gap:6px;margin-bottom:4px;font-size:13px}.fgh a{margin-inline-start:auto;font-size:12px;color:var(--hw);cursor:pointer;font-weight:700}
.fg.fgh{margin:0}
label.cb{flex-direction:row;align-items:center;gap:7px;padding:3px 2px;font-size:13px;color:var(--ink);font-weight:500;cursor:pointer;border-radius:6px}
label.cb:hover{background:var(--bg)}
label.cb input,.bxr input{width:16px;height:16px;min-height:0;margin:0;padding:0;accent-color:var(--hw);flex:none}
label.cb .c{margin-inline-start:auto;font-size:11.5px;color:var(--mut);font-variant-numeric:tabular-nums}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:12px}
.pc{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.pch{display:flex;align-items:flex-end;gap:10px;padding:12px 14px 10px;border-bottom:1px solid var(--line)}
.pch .nm{font-size:17px;font-weight:800}
.pch .tot{margin-inline-start:auto;text-align:end}.pch .tot b{font-size:24px;font-weight:800;color:var(--hw);font-variant-numeric:tabular-nums}.pch .tot span{font-size:13px;font-weight:700;color:var(--mut);margin-inline-start:2px}
.pc td{padding:7px 10px;vertical-align:middle}.pc tr:first-child td{border-top:0}
tr.ck{cursor:pointer}tr.ck:hover td{background:var(--bg)}
.bxg{border:1px solid var(--line);border-radius:12px;background:var(--card);margin-bottom:10px;overflow:hidden}
.bxh{display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--chip);cursor:pointer;flex-wrap:wrap}
.bxr{display:flex;align-items:center;gap:10px;padding:6px 12px;border-top:1px solid var(--line);font-size:13px;cursor:pointer;flex-wrap:wrap}
.bxr:hover{background:var(--bg)}.bxr.on{background:var(--hws)}
.bxbar{position:sticky;bottom:12px;z-index:5;display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 14px;margin-top:12px;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.bxbar textarea{flex:1 1 200px;min-height:44px;height:44px;max-height:110px;font:12px/1.5 ui-monospace,Consolas,monospace;padding:6px 8px}
.bxbar .btn{min-height:36px}.bxbar .btn.ghost{background:transparent;color:var(--bg);border-color:currentColor}
.bxnos{flex:1 1 100%;font-size:12px;line-height:1.6;max-height:90px;overflow-y:auto}
.bxno{display:inline-block;background:color-mix(in srgb,var(--bg) 16%,transparent);border-radius:6px;padding:1px 6px;margin:2px 4px 2px 0;white-space:nowrap}.bxno span{opacity:.75}
.bxsuf{flex-direction:row;align-items:center;color:inherit;font-size:12px}.bxsuf input{width:70px;min-height:32px;padding:4px 6px}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
@media(max-width:600px){h2{font-size:22px}.brand img{height:24px}table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:8px}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:6.5em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:6em;margin-inline-start:-6.5em;color:var(--mut);font-size:12px}.stack td:empty{display:none}.stack tr+tr{border-top:1px solid var(--line)}}
</style>
<script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>
</head>

const offStock=r=>isPorkTrace(r.trace)||offItem(r.part);
/* 두수: 이력번호(소 한 마리)·부위별로 남은 양 ÷ 입고량을 0.5두 단위로, 조금이라도 남으면 최소 0.5두 (원육재고판과 같은 방식) */
const fdu=n=>{const x=Math.round(n*10)/10;return Number.isInteger(x)?String(x):x.toFixed(1)};
function heads(list){const g=new Map();for(const r of list){const t=String(r.trace||'').replace(/\D/g,'');if(!t)continue;const k=t+'|'+(r.part||'');let a=g.get(k);if(!a){a={rem:0,lot:0};g.set(k,a)}a.rem+=+r.kg||0;a.lot=Math.max(a.lot,+r.lotKg||0)}
  let h=0;for(const a of g.values()){if(a.rem<=0.05)continue;const lot=a.lot>=a.rem?a.lot:a.rem;h+=Math.max(0.5,Math.round(Math.min(1,a.rem/lot)*2)/2)}return h}
let tT;const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('show'),2600)};

const S={db:null,user:null,me:null,live:false,base:{defects:new Map(),yields:new Map(),stock:new Map(),grades:new Map(),memos:new Map(),inplan:new Map(),inchk:new Map()},masters:{},names:{}};
const DEF={vendors:[],parts:[],defectTypes:[],yieldItems:[],yieldTargets:{},vendorNotes:{}};
/* 수율 기준 = 작년 한 해 품목별 가중 평균 (백업에서 온 것 bk-연도 + 앱에서 입력한 것 app-연도). 작년 기록이 없는 품목만 설정에 직접 적은 값을 씀 */
const LY=()=>new Date().getFullYear()-1;
S.ys={};
/* 항목 형식: {n:품목,i:투입kg,o:산출kg,c:건수}  (예전 [n,i,o,c] 배열도 읽음 — Firebase는 배열 안 배열을 못 씀) */
const ysIt=x=>Array.isArray(x)?{n:x[0],i:x[1],o:x[2],c:x[3]}:x;
function lyAvg(){const a={};for(const k of ['bk-'+LY(),'app-'+LY()])for(const {n,i,o} of ((S.ys[k]||{}).items||[]).map(ysIt)){a[n]=a[n]||{i:0,o:0};a[n].i+=+i||0;a[n].o+=+o||0}
  const t={};for(const [n,x] of Object.entries(a))if(x.i>0)t[n]=Math.round(x.o/x.i*1000)/10;return t}
const M=()=>{const m={...DEF,...S.masters};m.manualTargets=m.yieldTargets||{};m.yieldTargets={...m.manualTargets,...lyAvg()};return m};
async function ysAdd(r,sign){const y=String(r.date||'').slice(0,4);if(!/^\d{4}$/.test(y)||!S.db||offItem(r.item))return;
  try{const ref=S.db.doc('ystats/app-'+y),s=await ref.get(),items=((s&&s.exists&&s.data().items)||[]).map(ysIt);const e=items.find(x=>x.n===r.item)||(items.push({n:r.item,i:0,o:0,c:0}),items[items.length-1]);
    e.i=Math.round((e.i+sign*(+r.inKg||0))*10)/10;e.o=Math.round((e.o+sign*(+r.outKg||0))*10)/10;e.c+=sign;await ref.set({year:+y,items:items.filter(x=>x.c>0),at:new Date().toISOString()})}catch(e){}}

/* ---------- 오프라인 대기열: 저장 실패 시 이 기기에 보관했다가 연결되면 올림 ---------- */
const OB='hw_outbox_v1';
const obGet=()=>{try{return JSON.parse(localStorage.getItem(OB)||'[]')}catch(e){return []}};
const obPut=a=>{try{localStorage.setItem(OB,JSON.stringify(a))}catch(e){}};
async function rawWrite(it){const r=S.db.doc(it.path);if(it.op==='del')await r.delete();else await r.set(it.data)}
async function write(op,path,data){
  const it={op,path,data};
  if(S.db&&!obGet().length){
    try{await rawWrite(it);return true}
    catch(e){const c=e&&e.code;if(['invalid_argument','quota_exceeded','revoked','invalid-argument','resource-exhausted','permission-denied'].includes(c)){const col=String(path).split('/')[0];console.warn('write failed',c,path,e);
      toast(c==='quota_exceeded'||c==='resource-exhausted'?'저장 한도에 걸렸습니다. 잠시 후 다시 하거나 오래된 기록 정리가 필요합니다'
        :col==='masters'&&/permission/.test(c)?'설정 목록(업체·부위·메모 등)은 관리자 계정에서만 바꿀 수 있습니다'
        :/permission/.test(c)?'저장 권한이 없습니다. 공유 창에서 승인됐는지 확인하세요 ('+col+')':'값이 잘못되어 저장하지 못했습니다 ('+col+' · '+c+')');return false}}
  }
  const a=obGet();a.push(it);obPut(a);sync();paint();if(S.db)flush();else toast('연결되면 자동으로 올립니다 (대기 '+a.length+'건)');return true;
}
let flushing=false;
async function flush(){
  if(!S.db||flushing)return;let a=obGet();if(!a.length)return;flushing=true;
  while(a.length){try{await rawWrite(a[0])}catch(e){if(e&&['invalid_argument','quota_exceeded','invalid-argument','permission-denied'].includes(e.code)){a.shift();obPut(a);continue}break}a.shift();obPut(a)}
  flushing=false;sync();paint();
}
addEventListener('online',flush);setInterval(flush,30000);
function rows(col){
  const m=new Map(S.base[col]);
  for(const it of obGet()){const [c,id]=it.path.split('/');if(c!==col)continue;if(it.op==='del')m.delete(id);else m.set(id,{...it.data,_pending:true})}
  const l=[...m].map(([id,d])=>({id,...d}));
  return col==='stock'?l.filter(r=>!offStock(r)):col==='yields'?l.filter(r=>!offItem(r.item)):l;
}
function sync(){
  const n=obGet().length,el=$('#sync');
  el.textContent=!S.db?(n?'오프라인 · 대기 '+n+'건':'연결 중…'):n?'올리는 중 · 대기 '+n+'건':S.live?'● 실시간 공유 중':'○ 서버 응답 대기';
}

/* 하자육 하루 마감: 부위별 건수·중량과 쓴 이력·묶음번호 */
const f2=n=>(+n||0).toLocaleString('ko-KR',{minimumFractionDigits:2,maximumFractionDigits:2});
function dayGroups(d){const g={};for(const r of rows('defects').filter(r=>r.date===d)){const k=r.part||'(부위 없음)';const x=g[k]=g[k]||{part:k,n:0,kg:0,tr:[],ven:[]};x.n++;x.kg+=+r.kg||0;
    for(const t of String(r.trace||'').split(/[,\s]+/).filter(Boolean))if(!x.tr.includes(t))x.tr.push(t);if(r.vendor&&!x.ven.includes(r.vendor))x.ven.push(r.vendor)}
  return Object.values(g).sort((a,b)=>b.kg-a.kg)}
function dayText(d){const g=dayGroups(d);if(!g.length)return `[하자육 ${md(d)} 마감] 기록 없음`;
  return `[하자육 ${md(d)} 마감] ${g.reduce((s,x)=>s+x.n,0)}건 ${f2(g.reduce((s,x)=>s+x.kg,0))}kg\n`+g.map(x=>`■ ${x.part} ${x.n}건 ${f2(x.kg)}kg`+(x.tr.length?`\n   ${x.tr.map(t=>(t[0]==='L'?'묶음 ':'이력 ')+t).join(', ')}`:'')).join('\n')}

const memoHtml=r=>`<div class="memo${r.done?' done':''}"><div class="mh"><span class="badge ${r.tag==='문제'?'b-alert':r.tag==='요청'?'b-warn':r.tag==='공지'?'b-hw':'b-good'}">${esc(r.tag||'기타')}</span><b>${esc(r.name||who(r.by)||'')}</b>${r.prog&&r.prog!=='생산관리'?`<span class="badge b-chip">${esc(r.prog)}</span>`:''}<span>${ago(r.at)}${r._pending?' · 올리는 중':''}${r.done?' · 해결됨'+(r.doneName?' ('+esc(r.doneName)+')':''):''}</span>
 <span class="row"><button class="btn sm" data-done="${esc(r.id)}" type="button">${r.done?'다시 열기':'해결'}</button><button class="btn sm" data-mdel="${esc(r.id)}" type="button">삭제</button></span></div><p>${esc(r.text)}</p></div>`;
async function memoClick(e){
  const d=e.target.closest('[data-done]'),x=e.target.closest('[data-mdel]');

paint(){

  const vn=new Map();for(const v of [...mm.vendors,...df.map(r=>r.vendor),...st.map(r=>r.vendor)]){if(!v)continue;const k=vkey(v),p=vn.get(k);if(!p||(!mm.vendors.includes(p)&&(mm.vendors.includes(v)||v.length>p.length)))vn.set(k,v)}

    <div><div class="hint" style="margin-bottom:6px">입고 원육 등급 분포</div><div class="bars">${Object.keys(gr).length?Object.entries(gr).sort().map(([g,c])=>`<div class="br"><span>${esc(g)}</span><div class="tr"><div class="fl" style="width:${c/s.length*100}%"></div></div><span class="n">${c}박스</span></div>`).join(''):'<p class="hint">등급 자료 없음 — 이력·등급 메뉴에서 조회 결과를 넣으면 채워집니다</p>'}</div>

    if(!(await write('set','stock/'+id,{...d,status:'사용',usedAt:date||today(),usedHow:how,usedRef:ref||'',usedBy:S.me||''})))break;done.push({id,d})}
  return done}
async function undoBoxes(list){for(const x of list)await write('set','stock/'+x.id,{...x.d,status:'재고',usedAt:'',usedHow:'',usedRef:'',usedBy:''})}

/* 입고대장·묶음구성·출고내역 엑셀 (나라시스템/ERP 형식 자동 구분) */
const nz=v=>String(v??'').replace(/\s/g,'');
const hix=(H,names)=>{for(const n of names){const i=H.findIndex(h=>nz(h)===n);if(i>=0)return i}for(const n of names){const i=H.findIndex(h=>nz(h).includes(n));if(i>=0)return i}return -1};
const xd=v=>normDate(v instanceof Date&&!isNaN(v)?new Date(v.getTime()+432e5):v); // 엑셀 날짜가 시간대 때문에 전날로 오는 것 보정
const xn=v=>{const n=parseFloat(String(v??'').replace(/,/g,''));return isFinite(n)?n:0};
const trNo=v=>{let n=nz(v);if(/^\d{9,11}$/.test(n))n=n.padStart(12,'0');return n};
function parsePum(s){const raw=String(s||''),store=(raw.match(/\[(.+?)\]/)||[])[1]||'',p=raw.replace(/\[.*?\]/g,'').split('/');
  return {part:(p[0]||'').trim().replace(/^(한우|육우|젖소|수입|돈)/,'').trim(),sex:(p[1]||'').trim(),grade:(p[2]||'').trim(),store}}
function kindOf(aoa){for(let i=0;i<Math.min(aoa.length,15);i++){const j=(aoa[i]||[]).map(nz);
  if(j.includes('묶음번호')&&j.includes('바코드')&&j.some(x=>x.includes('개체식별번호')||x.includes('이력번호')))return [i,'lot'];
  if(j.includes('출고일자')&&j.includes('바코드')&&j.some(x=>x.includes('이력번호')))return [i,'out'];
  if(j.includes('입고일자')&&j.some(x=>x.includes('이력번호'))&&j.some(x=>x.includes('품목명')))return [i,'in']}return [-1,'']}
/* auto=true (자동 가져오기 폴더): 입고일이 7일보다 오래된 박스는 넣지 않음 → 옛 입고대장을 실수로 넣어도 재고가 부풀지 않음 (엑셀 올리기로 직접 넣으면 그대로 들어감) */
async function impIn(aoa,h,log,auto){let old=0,oldMin='';const H=aoa[h],C={d:hix(H,['입고일자']),slip:hix(H,['전표번호']),pum:hix(H,['품목명']),w:hix(H,['입고량']),corp:hix(H,['입고거래처']),no:hix(H,['이력번호']),sd:hix(H,['도축일자']),sex:hix(H,['성별']),grade:hix(H,['등급']),bc:hix(H,['바코드']),marb:hix(H,['근내지방도']),valid:hix(H,['유효일자'])};
  const list=[],lot={},occ={};
  for(let i=h+1;i<aoa.length;i++){const r=aoa[i],no=trNo(r[C.no]);if(!/^\d{12}$/.test(no))continue;const d=xd(r[C.d]);if(!d)continue;
    if(auto&&d<addDays(today(),-7)){old++;if(!oldMin||d<oldMin)oldMin=d;continue}
    const p=parsePum(r[C.pum]),w=xn(r[C.w]),bc=C.bc>=0?nz(r[C.bc]):'';let key=bc||[d,nz(r[C.slip]),no,nz(r[C.pum]),w].join('|');occ[key]=(occ[key]||0)+1;if(!bc&&occ[key]>1)key+='#'+occ[key];
    const grade=String(C.grade>=0&&r[C.grade]||p.grade||'').trim(),marb=String((C.marb>=0&&String(r[C.marb]).trim())||(grade.match(/\((\d)\)/)||[])[1]||'');
    const sd=C.sd>=0?xd(r[C.sd]):'';
    const doc={barcode:bc,trace:no,vendor:String(r[C.corp]||'').trim(),part:p.part,grade,marb,sex:String(C.sex>=0&&r[C.sex]||p.sex||'').trim(),store:p.store,slaughter:sd,inDate:d,kg:w,shelfDate:p.store==='냉동'&&C.valid>=0?xd(r[C.valid]):'',status:'재고',by:S.me||'',at:new Date().toISOString()};
    if(offStock(doc))continue;lot[no+'|'+p.part]=(lot[no+'|'+p.part]||0)+w;list.push({id:safeId(key),doc})}
  const have=new Set(rows('stock').map(r=>r.id));let add=0,skip=0,pre=0,preRef=new Set();
  const plan=sdPlan(list.map(x=>({id:x.id,...x.doc}))); // 설도: 파일 안 한 마리 전체 박스로 나눔 정보 저장
  for(const x of list){if(plan.has(x.id))Object.assign(x.doc,plan.get(x.id));x.doc.lotKg=Math.round((lot[x.doc.trace+'|'+x.doc.part]||0)*100)/100;
    if(have.has(x.id)){skip++;continue}
    if(S.db){try{const ex=await S.db.doc('stock/'+x.id).get();if(ex.exists){have.add(x.id);skip++;continue}}catch(e){}
      // 묶음구성·출고내역이 먼저 들어와 기억해 둔 바코드면 바로 사용 처리로 넣음
      try{const u=await S.db.doc('usedbc/'+x.id).get();if(u.exists){const v=u.data();Object.assign(x.doc,{status:'사용',usedAt:v.date||today(),usedHow:v.how||'묶음',usedRef:v.ref||'',usedBy:S.me||''});pre++;if(v.ref&&(v.how||'묶음')==='묶음')preRef.add(String(v.ref))}}catch(e){}}
    if(!(await write('set','stock/'+x.id,x.doc)))break;have.add(x.id);add++;if(add%20===0){log(`입고 ${add}박스 올림…`);await new Promise(r=>setTimeout(r,300))}}
  let relot=0;if(preRef.size&&S.db){try{const ds=[];for(const r of preRef){for(const id of [...new Set([r,normTr(r),safeId(r)])]){try{const x=await S.db.doc('lotsum/'+id).get();if(x.exists){ds.push(x.data());break}}catch(e){}}}if(ds.length)relot=(await lotRecalc(ds)).n}catch(e){}}
  return `입고대장: 새 박스 ${add}개${pre?` (그중 ${pre}개는 이미 묶음·출고된 것이라 사용 처리)`:''}${skip?`, 이미 있던 ${skip}개 건너뜀`:''}${old?` · 입고일이 7일 넘은 ${old}박스(${md(oldMin)}~)는 넣지 않음 — 필요하면 원육 재고 → 엑셀 올리기로`:''}${relot?` · 묶음 정리 ${relot}묶음 다시 계산`:''}`}
/* 묶음 정리(카톡용): 묶음번호별로 "끝4자리 등급부위 업체두수" — 예) 6266 7설깃 백제1,참0.5
   부위·등급·이력번호·중량은 묶음구성 파일에서, 업체와 그 소의 처음 중량(두수 계산)은 공유 장부의 같은 바코드 박스에서 */
const PSHORT={'아랫등심':'아랫등','윗등심':'윗등','꽃등심':'꽃등','제비추리':'제비','토시살':'토시','살치살':'살치','설깃살':'설깃','설깃머리살':'설깃머리','차돌박이':'차돌','업진살':'업진','치마살':'치마','부채살':'부채','보섭살':'보섭','삼각살':'삼각','도가니살':'도가니','갈비살':'갈비','안창살':'안창','갈비덧살':'갈비덧','앞다리살':'앞다리','홍두깨살':'홍두깨','우둔살':'우둔'};
const pShort=p=>PSHORT[p]||String(p||'').replace(/살$/,'');
const wkMW=s=>{if(!s)return '';const d=new Date(s+'T00:00:00');return isNaN(d)?'':(d.getMonth()+1)+'-'+Math.ceil(d.getDate()/7)}; // 도축 주차: 11-4 = 11월 4주차
/* 박스마다 업체·장부 부위·도축일을 붙이고, 그 소(이력번호)·부위가 장부에 가진 전체 중량(쓴 박스 포함)을 모음 → 반 마리(0.5두) 계산 */
async function lotEnrich(boxes){const mp=new Map(rows('stock').map(r=>[r.id,r])),dp=s=>SDORD.includes(s.partFix)?s.partFix:SDORD.includes(s.sdPart)?s.sdPart:s.part;
  for(const b of boxes){let s=mp.get(b.id);if(!s&&S.db){try{const x=await S.db.doc('stock/'+b.id).get();if(x.exists)s=x.data()}catch(e){}}
    b.vendor=s?s.vendor||'':b.vendor||'';b.lp=s?dp(s):(b.lp||b.part);if(!b.marb&&s)b.marb=marbOf(s);if(!b.sd&&s)b.sd=s.slaughter||''}
  const tot={};for(const t of [...new Set(boxes.map(b=>b.no).filter(Boolean))]){try{const q=await S.db.collection('stock').where('trace','==',t).get();
    for(const d of q.docs){const s=d.data();if(!(+s.kg>0))continue;const k=t+'|'+dp(s);tot[k]=(tot[k]||0)+(+s.kg)}}catch(e){}}
  return tot}
/* 한 묶음 = 등급별 한 줄. 소 한 마리 = 그 묶음에 들어간 그 소 부위 중량 ÷ 그 소 부위 전체 중량 → 0.5두 단위 (여러 부위면 큰 쪽) */
const LOTSUB=/^(설깃|보섭|도가니|삼각)/;/* 설도 작은 부위: 한 마리에서 양쪽 2박스 → 2박스 1두, 1박스 0.5두 */
function lotLines(bs,tot){const g=new Map();
  for(const b of bs){const k=b.marb||'';let x=g.get(k);if(!x){x={marb:b.marb||'',parts:[],tr:new Map(),n:0,kg:0,wk:new Set()};g.set(k,x)}x.n++;x.kg+=b.w;if(!x.parts.includes(b.part))x.parts.push(b.part);const w=wkMW(b.sd);if(w)x.wk.add(w);
    const t=x.tr.get(b.no)||{p:{},v:b.vendor};const sub=LOTSUB.test(b.part||''),pk=sub?'#'+b.part:b.lp;const q=t.p[pk]||(t.p[pk]={w:0,n:0,sub,tot:tot[b.no+'|'+b.lp]||0});q.w+=b.w;q.n++;if(!t.v)t.v=b.vendor;x.tr.set(b.no,t)}
  return [...g.values()].map(x=>{const v={};for(const t of x.tr.values()){const h=Math.max(...Object.values(t.p).map(q=>q.sub?Math.min(1,q.n/2):q.tot?Math.max(0.5,Math.round(Math.min(1,q.w/Math.max(q.tot,q.w))*2)/2):1));const k=t.v||'?';v[k]=(v[k]||0)+h}
    return {marb:x.marb,part:x.parts.join('·'),n:x.n,kg:Math.round(x.kg*10)/10,v,wk:[...x.wk].sort((a,b)=>{const p=s=>s.split('-').map(Number);const [am,aw]=p(a),[bm,bw]=p(b);return am-bm||aw-bw})}})}
async function lotSave(lot,bs,tot){let addedAt=new Date().toISOString();try{const ex=await S.db.doc('lotsum/'+lot).get();if(ex.exists)addedAt=ex.data().addedAt||ex.data().at||addedAt}catch(e){}
  const boxes=bs.map(b=>({id:b.id,no:b.no,part:b.part,lp:b.lp||b.part,w:Math.round(b.w*100)/100,marb:b.marb||'',sd:b.sd||'',vendor:b.vendor||''}));
  return write('set','lotsum/'+lot,{lot,date:bs[0].date,lines:lotLines(bs,tot),boxes,addedAt,at:new Date().toISOString()})}
async function lotSum(aoa,h){const H=aoa[h],C={d:hix(H,['연월일','묶음일자']),lot:hix(H,['묶음번호']),bc:hix(H,['바코드']),no:hix(H,['개체식별번호','이력번호']),part:hix(H,['부위명']),w:hix(H,['중량']),pum:hix(H,['품목명']),sd:hix(H,['도축일자'])};
  let d0='',l0='';const boxes=[],seenBc=new Set();
  for(let i=h+1;i<aoa.length;i++){const r=aoa[i];const d=xd(r[C.d]);if(d)d0=d;const l=normTr(r[C.lot]);if(l)l0=l;const bc=nz(r[C.bc]);if(!bc||!l0||seenBc.has(bc))continue;seenBc.add(bc);
    let w=xn(r[C.w]);if(w>=200)w=w/1000;const pum=String(C.pum>=0?r[C.pum]:'');
    boxes.push({lot:l0,date:d0,bc,id:safeId(bc),no:trNo(r[C.no]),part:String(r[C.part]||'').trim()||parsePum(pum).part,w,marb:(pum.match(/\((\d)\)/)||[])[1]||'',sd:C.sd>=0?xd(r[C.sd]):''})}
  if(!boxes.length)return '';
  const tot=await lotEnrich(boxes);
  const byLot=new Map();for(const b of boxes){(byLot.get(b.lot)||byLot.set(b.lot,[]).get(b.lot)).push(b)}
  let n=0;for(const [lot,bs] of byLot){if(await lotSave(lot,bs,tot))n++;else break}
  return `묶음 정리 ${n}묶음`}
/* 이미 정리된 날짜를 지금 장부 기준으로 다시 계산 (박스 목록이 저장된 묶음만) */
async function lotRecalc(docs){const has=docs.filter(d=>Array.isArray(d.boxes)&&d.boxes.length),all=has.flatMap(d=>d.boxes.map(b=>({...b,date:d.date,lot:d.lot})));
  if(!all.length)return {n:0,miss:docs.length};const tot=await lotEnrich(all);let n=0;
  for(const d of has){if(await lotSave(d.lot,all.filter(b=>b.lot===d.lot),tot))n++}return {n,miss:docs.length-has.length}}
async function impUse(aoa,h,kind){const lotMsg=kind==='lot'?await lotSum(aoa,h):'';const H=aoa[h],C=kind==='lot'?{d:hix(H,['연월일','묶음일자']),lot:hix(H,['묶음번호']),bc:hix(H,['바코드'])}:{d:hix(H,['출고일자']),corp:hix(H,['출고거래처']),bc:hix(H,['바코드']),memo:hix(H,['전표비고'])};
  const mp=new Map(rows('stock').map(r=>[r.id,r]));let d0='',l0='',n=0,gone=0;const by={},pend=[];
  for(let i=h+1;i<aoa.length;i++){const r=aoa[i],bc=nz(r[C.bc]);let d=xd(r[C.d]);if(kind==='lot'){if(d)d0=d;else d=d0;const l=nz(r[C.lot]);if(l)l0=l}
    if(!bc)continue;const id=safeId(bc);
    const memo=kind==='out'?String(C.memo>=0?r[C.memo]:'').trim():'',corp=kind==='out'?String(r[C.corp]||'').trim():'';
    const how=kind==='lot'?'묶음':(/반품/.test(memo)||corp==='자사관리')?'반품':'출고',ref=kind==='lot'?(normTr(l0)||l0):corp+(memo?' · '+memo:'');
    // 재고에 아직 없는 바코드(입고대장이 나중에 올 수 있음)는 기억해 두었다가 입고될 때 바로 사용 처리
    if(!mp.has(id)){gone++;pend.push({id,d:{how,date:d,ref,at:new Date().toISOString()}});continue}
    const k=[how,d,ref].join('\u0001');(by[k]=by[k]||[]).push(id);mp.delete(id)}
  /* 화면에 다 못 불러온 박스(재고가 많을 때)일 수 있으니 공유 장부에서 한 번 더 확인 */
  if(S.db&&pend.length){const keep=[];for(const x of pend){let s=null;try{const q=await S.db.doc('stock/'+x.id).get();if(q.exists)s=q.data()}catch(e){}
    if(s&&s.status!=='사용'){const k=[x.d.how,x.d.date,x.d.ref].join('\u0001');(by[k]=by[k]||[]).push(x.id);gone--}else if(!s)keep.push(x)}pend.length=0;pend.push(...keep)}
  for(const [k,ids] of Object.entries(by)){const [how,d,ref]=k.split('\u0001');n+=(await useBoxes(ids,how,d,ref)).length}
  for(const x of pend)if(!(await write('set','usedbc/'+x.id,x.d)))break;
  return `${kind==='lot'?'묶음구성':'출고내역'}: ${n}박스 재고에서 뺌${gone?` (이미 빠졌거나 아직 입고 안 된 바코드 ${gone}개는 입고되면 바로 빠지게 기억)`:''}${lotMsg?' · '+lotMsg:''}`}

/* 업무도구 앱의 자동 가져오기 폴더: 입고대장·묶음구성·출고내역을 공유 장부에 바로 반영. 로그인 전이면 {retry:true}로 나중에 다시 */
/* 생산일보(생산내역): 산출 품목 중 "하자육"이 있는 전표를 하자육 기록으로 자동 등록.
   날짜=생산일자, 업체=거래처, 부위=투입품목(한우설깃/암소/1++(7) → 설깃), 중량=생산중량(g→kg), 이력번호=투입 이력·묶음번호. 같은 전표·줄은 한 번만 */
const isProdDaily=aoa=>aoa.some(r=>r&&r[0]==='순번'&&r[1]==='투입품목');
async function impProd(aoa){const recs=[];let cur=null,st=null;const num=v=>+String(v??'').replace(/,/g,'')||0;
  for(let i=0;i<aoa.length;i++){const r=aoa[i]||[];
    if(r[0]==='생산일자'){const d=aoa[i+1]||[];cur={date:xd(d[0]),slip:String(d[1]??'').trim(),vendor:String(d[2]||'').trim(),trace:normTr(d[6]),total:num(d[4]),inputs:[],outs:[]};recs.push(cur);i++;st=null;continue}
    if(r[0]==='순번'&&r[1]==='투입품목'){st='in';continue}
    if(r[0]==='순번'&&r[1]==='품목명'){st='out';continue}
    if(!cur||typeof r[0]!=='number'||!r[1])continue;
    if(st==='in')cur.inputs.push({name:String(r[1]),trace:normTr(r[2])});
    if(st==='out')cur.outs.push({no:r[0],name:String(r[1]),g:num(r[4])})}
  const partOf=s=>String(s).replace(/\[.*?\]/g,'').split('/')[0].replace(/^(한우|육우|젖소|수입)/,'').trim();
  let add=0,skip=0;
  for(const c of recs){if(!c.date)continue;
    for(const o of c.outs.filter(o=>/하자/.test(o.name)&&o.g>0)){
      const id='pd-'+c.date+'-'+safeId(c.slip||c.vendor)+'-'+o.no;
      if(S.base.defects.has(id)){skip++;continue}
      try{const ex=await S.db.doc('defects/'+id).get();if(ex.exists){skip++;continue}}catch(e){}
      const parts=[...new Set(c.inputs.map(x=>partOf(x.name)).filter(Boolean))];
      // 설도에서 나온 부위(도가니살·보섭살·삼각살)만 투입됐으면 하자육은 "설도"로 기록
      const SD=['도가니살','보섭살','삼각살','설도'],pt=parts.length&&parts.every(p=>SD.includes(p))?'설도':parts.join('·');
      const d={date:c.date,vendor:c.vendor,part:pt||'(부위 없음)',type:'하자육',kg:Math.round(o.g)/1000,qty:0,trace:(c.inputs.find(x=>x.trace)||{}).trace||c.trace||'',note:'생산일보 전표 '+c.slip,src:'생산일보',by:S.me||'',at:new Date().toISOString()};

      if(b.dataset.act==='erp')await write('set','inplan/'+p.id,{...o,erp:!p.erp});

    $('#ckCopy').onclick=()=>{const c=this.chk();if(!c)return;copy(`[입고 검수] ${mdw2(ibDate)}\n`+c.rows.map(x=>`■ ${x.v} ${x.p} ${x.g}: ${fdu(x.h)}두 (${x.wk.map(w=>w+' '+fdu(x.byW[w]||0)).filter(s=>!/ 0$/.test(s)).join(', ')})`).join('\n')+(c.short.length?`\n\n[중량미달]\n`+c.short.map(s=>`${s.part} ${s.trace} ${f1(s.kg)}kg (${s.rule}) ${s.diff}`).join('\n'):'')+(c.odd.length?`\n\n[확인 필요: 평균과 많이 다름]\n`+c.odd.map(s=>`${s.part} ${s.trace} ${f1(s.kg)}kg (평균 ${f1(s.avg)}kg, ${Math.abs(s.pct)}% ${s.pct>0?'무거움':'가벼움'})`).join('\n'):''))};

      await write('set','inchk/'+id,{...o,date:ibDate,vendor:t.dataset.v,[t.dataset.f]:t.type==='checkbox'?t.checked:t.value.trim(),by:S.me||'',at:new Date().toISOString()})};

/* 검수: 그날 입고된 박스 전체(쓴 박스 포함)를 한 번 읽어 옴 */
async loadChk(){if(!$('#ckBody'))return;$('#ibD').value=ibDate;$('#ckBody').innerHTML='<p class="hint">불러오는 중…</p>';
  if(!S.db){$('#ckBody').innerHTML='<p class="hint">로그인 후 볼 수 있습니다.</p>';return}
  try{const s=await S.db.collection('stock').where('inDate','==',ibDate).get();this.ckDocs=s.docs.map(d=>({id:d.id,...d.data()})).filter(r=>!offStock(r)&&(+r.kg||0)>0);this.ckDate=ibDate}
  catch(e){$('#ckBody').innerHTML='<p class="hint">불러오지 못했습니다: '+esc(e.code||e.message)+'</p>';return}
  this.paint()},
chk(){if(!this.ckDocs||this.ckDate!==ibDate)return null;const docs=this.ckDocs,SP=sdSplit(docs);
  const wkL=s=>{if(!s)return '도축일 없음';const d=new Date(s+'T00:00:00');return (d.getMonth()+1)+'-'+Math.ceil(d.getDate()/7)};
  const g=new Map(),weeks=new Set();
  for(const r0 of docs){const r={...r0,part:SP.get(r0.id)||r0.part},mb=marbOf(r)||'-',w=wkL(r.slaughter);weeks.add(w);
    const k=[r.vendor,r.part,mb].join('|');let x=g.get(k);if(!x){x={v:r.vendor,p:r.part,g:mb,box:0,kg:0,tr:new Map()};g.set(k,x)}
    x.box++;x.kg+=+r.kg||0;const t=normTr(r.trace)||r.id;const a=x.tr.get(t)||{kg:0,lot:0,w};a.kg+=+r.kg||0;a.lot=Math.max(a.lot,r.sdLot?+r.sdLot:r0.part==='설도'&&SP.has(r0.id)?0:(+r.lotKg||0));x.tr.set(t,a)}
  const wk=[...weeks].sort((a,b)=>{const p=s=>s.split('-').map(Number);const [am,aw]=p(a),[bm,bw]=p(b);return (am-bm)||(aw-bw)});
  const rows_=[...g.values()].map(x=>{x.byW={};x.h=0;for(const a of x.tr.values()){const lot=a.lot>=a.kg?a.lot:a.kg,h=a.lot?Math.max(0.5,Math.round(Math.min(1,a.kg/lot)*2)/2):1;x.byW[a.w]=(x.byW[a.w]||0)+h;x.h+=h}x.wk=wk;return x})
    .sort((a,b)=>vkey(a.v).localeCompare(vkey(b.v),'ko')||a.p.localeCompare(b.p,'ko')||String(b.g).localeCompare(String(a.g)));
  // 중량 기준: "6.0kg 이상" / "7.0kg 이하"
  const rules=inSpec().map(s=>{const m=String(s.w||'').match(/([\d.]+)\s*kg\s*(이상|이하)/);return m?{n:s.n,v:+m[1],ge:m[2]==='이상',rule:s.w}:null}).filter(Boolean);
  const short=[];for(const r0 of docs){const part=SP.get(r0.id)||r0.part,ru=rules.find(x=>x.n===part)||rules.find(x=>part.includes(x.n)||x.n.includes(part));if(!ru)continue;const kg=+r0.kg||0;
    if(ru.ge?kg<ru.v:kg>ru.v)short.push({part,trace:normTr(r0.trace),bc:r0.barcode||r0.id,vendor:r0.vendor,kg,rule:ru.rule,diff:ru.ge?f1Kg(ru.v-kg)+' 미달':f1Kg(kg-ru.v)+' 초과'})}
  // 평균과 많이 다른 박스: 같은 부위 박스(재고 + 그날 입고) 평균보다 30% 이상 무겁거나 가벼우면 확인 필요
  // 업체마다 포장이 달라 같은 업체·같은 부위끼리 먼저 비교 (6박스 미만이면 같은 부위 전체). 원래 들쭉날쭉한 부위는 퍼짐(표준편차)을 넘을 때만
  const pool=new Map(),add=(k,kg)=>{if(kg>0){const a=pool.get(k)||[];a.push(kg);pool.set(k,a)}};

async function bkRun(P){

    O.innerHTML='<p class="hint">만드는 중…</p>';const H=window.__HWA_APP__?(parent.hwaApp||window.hwaApp):null;let L=null;if(H&&H.naraLedger){try{L=await H.naraLedger()}catch(e){}}

uxBind(){$('#uxD').value=today();
  $('#uxFind').onclick=async()=>{const d=$('#uxD').value,a=$('#uxA').value,b=$('#uxB').value,O=$('#uxOut');if(!d||!a||!b)return toast('날짜와 시작·끝 시각을 넣어주세요');if(!S.db)return toast('로그인 후 쓸 수 있습니다');

      let n=0;for(const r of live){const {id:_i,...x}=r;if(!(await write('set','stock/'+r.id,{...x,status:'사용',usedAt:today(),usedHow:'정리',usedRef:'잘못 넣은 옛 입고대장 ('+d+' '+a+'~'+b+')',usedBy:S.me||''})))break;if(++n%20===0){$('#uxMsg').textContent=n+' / '+live.length+'…';await new Promise(r=>setTimeout(r,300))}}
      $('#uxMsg').textContent=n+'박스를 재고에서 뺐습니다';toast(n+'박스를 정리했습니다')}}},
bind(){this.fill();bkBind();this.uxBind();this.nvBind();$('#mF').onsubmit=async e=>{e.preventDefault();const yt={},yi=[];for(const l of lines($('#mY').value)){const [k,v]=l.split('=').map(s=>s.trim());if(!k)continue;yi.push(k);if(v&&!isNaN(+v))yt[k]=+v}

(async()=>{
